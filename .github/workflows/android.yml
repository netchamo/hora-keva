name: אפליקציה לאנדרואיד

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest icons www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon, version and signing key
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          rm -f $RES/mipmap-*/ic_launcher_foreground.png
          cp -r android-build/res/. $RES/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hora-keva.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: גרסה 1.${{ github.run_number }}
          body: קובץ ההתקנה לאנדרואיד נמצא למטה, בשם hora-keva.apk
          files: hora-keva.apk
          make_latest: true
