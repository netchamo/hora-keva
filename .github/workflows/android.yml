name: אפליקציה לאנדרואיד

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest icons www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon, version and signing key
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          rm -f $RES/mipmap-*/ic_launcher_foreground.png
          cp -r android-build/res/. $RES/
          grep -q windowSoftInputMode android/app/src/main/AndroidManifest.xml || sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:windowSoftInputMode="adjustResize"#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  hk {
                      storeFile file("${rootDir}/../android-build/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.hk; minifyEnabled false }
                  debug { signingConfig signingConfigs.hk }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../hora-keva.apk
          keytool -printcert -jarfile ../hora-keva.apk | grep SHA256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: גרסה 1.${{ github.run_number }}
          body: קובץ ההתקנה לאנדרואיד נמצא למטה, בשם hora-keva.apk
          files: hora-keva.apk
          make_latest: true
